# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# Builds the .debs for amd64, arm64 and armhf with nfpm and attaches them,
# plus the bare binaries, to a GitHub release for the tag.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Makefile derives the version from the tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: package
        run: make deb VERSION="${GITHUB_REF_NAME#v}"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" \
            dist/*.deb dist/drivelist-linux-*
