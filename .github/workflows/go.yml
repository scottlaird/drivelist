name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    name: gofmt and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet -tags nolibzfs ./...

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # go-libzfs (2021 snapshot) does not compile against the OpenZFS 2.2
          # headers on ubuntu-24.04; 22.04 ships 2.1. The exec-zpool path from
          # the fleet design is what retires this pin.
          - name: linux libzfs
            os: ubuntu-22.04
            tags: ""
            libzfs: true
          - name: linux nolibzfs
            os: ubuntu-latest
            tags: nolibzfs
            libzfs: false
          - name: macos
            os: macos-latest
            tags: ""
            libzfs: false
    steps:
      - uses: actions/checkout@v4
      - name: install libzfs
        if: matrix.libzfs
        run: sudo apt-get install -y libzfslinux-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: test
        run: go test -race -tags "${{ matrix.tags }}" ./...
