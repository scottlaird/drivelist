syntax = "proto3";

package drivelist.v1;

option go_package = "github.com/scottlaird/drivelist/internal/pb/drivelistv1;drivelistv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Collector is the agent-facing service. Agents post what they see; the
// server decides what changed.
service Collector {
  // ReportInventory posts the complete current inventory of one host.
  rpc ReportInventory(ReportInventoryRequest) returns (ReportInventoryResponse);
  // ReportKernel posts hourly counts of classified kernel log lines per
  // drive. Each bucket is sent once, complete; resending replaces.
  rpc ReportKernel(ReportKernelRequest) returns (ReportAck);
  // ReportSmart posts SMART summaries, with the raw smartctl JSON at most
  // daily per drive or when the summary changed.
  rpc ReportSmart(ReportSmartRequest) returns (ReportAck);
  // ReportIO posts hourly I/O buckets per drive, as deltas of the kernel's
  // counters. A bucket already stored is replaced.
  rpc ReportIO(ReportIORequest) returns (ReportAck);
  // ReportDiskStats carries raw /proc/diskstats counters from a host with
  // no agent (a pulled report); the server diffs them against the last
  // ones it holds and stores the interval as one I/O bucket.
  rpc ReportDiskStats(ReportDiskStatsRequest) returns (ReportAck);
}

// Query is the operator-facing service behind the CLI.
service Query {
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc ListDrives(ListDrivesRequest) returns (ListDrivesResponse);
  // GetDrive resolves a serial, WWN, or unambiguous prefix of either.
  rpc GetDrive(GetDriveRequest) returns (GetDriveResponse);
  // GetDriveHistory returns every placement and event for one drive,
  // oldest first.
  rpc GetDriveHistory(GetDriveHistoryRequest) returns (GetDriveHistoryResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // ListMissing returns drives whose last placement ended with vanished and
  // whose status does not expect absence, plus open pool ghosts.
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);
  // Annotate records a manual status change or note as an event.
  rpc Annotate(AnnotateRequest) returns (AnnotateResponse);
  // GetKernel returns a drive's kernel log counts, newest bucket first.
  rpc GetKernel(GetKernelRequest) returns (GetKernelResponse);
  // GetSmart returns a drive's SMART samples, newest first, optionally with
  // the latest raw smartctl output.
  rpc GetSmart(GetSmartRequest) returns (GetSmartResponse);
  // GetIO returns a drive's I/O buckets, newest first.
  rpc GetIO(GetIORequest) returns (GetIOResponse);
  // CompareIO returns every currently placed drive's latency and
  // utilisation over a window next to the median of its vdev, so an
  // outlier among identical drives stands out.
  rpc CompareIO(CompareIORequest) returns (CompareIOResponse);
  // MergeDrives folds one drive record into another: use it when one
  // physical drive got two records, such as from being seen once without
  // its WWN. Everything moves to `into`; `from` keeps resolving to it.
  rpc MergeDrives(MergeDrivesRequest) returns (MergeDrivesResponse);
  // MergeHosts folds one host record into another, for a host reinstalled
  // with a new machine id. Refs are hostnames or machine ids.
  rpc MergeHosts(MergeHostsRequest) returns (MergeHostsResponse);
  // Rebuild recomputes every placement and derived event from the stored
  // snapshots. Annotations, merges, samples and ghosts are kept.
  rpc Rebuild(RebuildRequest) returns (RebuildResponse);
  // ListEnclosures lists the enclosures drives sit in.
  rpc ListEnclosures(ListEnclosuresRequest) returns (ListEnclosuresResponse);
  // NameEnclosure records what a person calls an enclosure; every view
  // shows the name in place of the kernel's expander-H:N from then on.
  rpc NameEnclosure(NameEnclosureRequest) returns (NameEnclosureResponse);
  // GetSAS returns one host's SAS topology as the server last saw it.
  rpc GetSAS(GetSASRequest) returns (GetSASResponse);
  // ListSASErrors lists the phys whose error counters climbed in a window.
  rpc ListSASErrors(ListSASErrorsRequest) returns (ListSASErrorsResponse);
  // ListBays shows an enclosure bay by bay, as its hardware profile lays
  // them out, with what sits in each.
  rpc ListBays(ListBaysRequest) returns (ListBaysResponse);
  // ListSmart returns every placed drive with its newest SMART reading.
  rpc ListSmart(ListSmartRequest) returns (ListSmartResponse);
  // ListDimms lists every host's memory modules with their error counts.
  rpc ListDimms(ListDimmsRequest) returns (ListDimmsResponse);
}

// ---------- shared ----------

message HostIdentity {
  string machine_id = 1;    // /etc/machine-id or IOPlatformUUID; the key, never shown
  string hostname = 2;
  string os = 3;            // "linux", "darwin"
  string agent_version = 4;
  string boot_id = 5;       // the kernel's boot id; a new one means the host rebooted. "" from agents before 0.9
  google.protobuf.Timestamp booted_at = 6;
}

// DriveIdentity is how an agent names a drive. The server resolves it to a
// drive record through its keys; agents never see drive ids.
message DriveIdentity {
  string wwn = 1;           // "0x5000cca25206c808", "eui.…", or ""
  string vendor = 2;
  string model = 3;
  string serial = 4;
}

enum Bus {
  BUS_UNSPECIFIED = 0;
  BUS_SAS = 1;
  BUS_SATA = 2;
  BUS_NVME = 3;
  BUS_USB = 4;
  BUS_VIRTIO = 5;
}

// ---------- Collector ----------

message Device {
  string dev_name = 1;                // "sdab", "nvme0n1"
  DriveIdentity identity = 2;
  Bus bus = 3;
  uint64 size_bytes = 4;
  string expander = 5;                // "expander-11:0"
  string bay = 6;                     // "54"
  string enclosure_path = 7;
  repeated string uses = 8;           // "zfs > space … > disk …", "mount > /boot"
  repeated string dev_links = 9;      // /dev/disk/by-id/…, used to match pool members
  string error = 10;                  // non-empty: identity unreadable; the report is degraded
  string member_state = 11;           // ZFS vdev state for the zfs use, "" otherwise
  string scsi_addr = 12;              // "11:0:17:0"
  string expander_id = 13;            // the expander's SAS address, stable across boots; "" if unknown
  // Where the drive physically is: the SES enclosure it sits in (its
  // logical identifier, which end devices report with or without an
  // expander in the path) and the node whose port reaches it, an
  // expander or the HBA itself for its own bays. Placements are keyed on
  // enclosure_id, falling back to enclosure_via_id, then enclosure_via.
  string enclosure_id = 14;
  string enclosure_via = 15;          // "expander-11:0", "host11"
  string enclosure_via_id = 16;       // that node's SAS address
  string enclosure_model = 17;        // what the enclosure is, when the host knows: the chassis from DMI for NVMe bays
  string enclosure_board = 18;        // the DMI board name with it: vendors reuse a product name across boards
}

message EmptyBay {
  string expander = 1;
  string bay = 2;
  string enclosure_path = 3;
  string expander_id = 4;
  string enclosure_id = 5;
  string enclosure_via = 6;
  string enclosure_via_id = 7;
  string enclosure_model = 8;
  string enclosure_board = 9;
}

// UnmappedMember is a pool member the collector could not map to a Device.
message UnmappedMember {
  string pool = 1;
  string path = 2;
  string guid = 3;
  string state = 4;
}

message ReportInventoryRequest {
  HostIdentity host = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated Device devices = 3;
  repeated EmptyBay empty_bays = 4;
  repeated UnmappedMember unmapped_members = 5;
  bool complete = 6;                  // false if a collector stage failed outright
  repeated string collector_errors = 7;
  repeated SasNode sas_nodes = 8;     // the SAS topology, empty from agents before 0.6 or hosts without SAS
  repeated SasPhy sas_phys = 9;
  repeated Dimm dimms = 10;           // memory modules, empty from agents before 0.9 or hosts that describe none
}

// SasNode is an HBA or expander: something with phys of its own.
message SasNode {
  string kind = 1;                    // "hba" | "expander"
  string name = 2;                    // the kernel's name: "host11", "expander-11:0"
  string address = 3;                 // SAS address, the key
  string vendor = 4;
  string product = 5;
  string revision = 6;                // firmware
  string parent_address = 7;          // the node upstream; "" for an HBA
  string upstream_port = 8;           // the upstream node's port that leads here
}

// SasPhy is one phy of a node: its link, what is on the far end, and the
// four SAS error counters the kernel keeps for it, cumulative since boot.
message SasPhy {
  string owner_address = 1;           // the node's address
  uint32 phy_id = 2;
  string name = 3;                    // "phy-11:0:5"
  string port = 4;                    // the port it is bundled into; "" when nothing is attached
  uint32 port_width = 5;              // phys in that port
  string rate = 6;                    // negotiated_linkrate as the kernel prints it
  double rate_gbit = 7;               // 0 without a link
  string attached_kind = 8;           // "expander" | "drive" | "device" | "upstream" | ""
  string attached = 9;                // "expander-11:1", "end_device-11:0:4"
  string attached_address = 10;
  string dev_name = 11;               // the block device behind it, if a drive
  string bay = 12;
  bool enabled = 13;
  uint64 invalid_dword = 14;
  uint64 disparity_error = 15;
  uint64 loss_dword_sync = 16;
  uint64 phy_reset_problem = 17;
}

// Dimm is one memory module: what the firmware says of it (SMBIOS type
// 17) joined to the kernel's EDAC error counts for it. A module EDAC does
// not know has no edac; an EDAC entry no slot matched has no slot.
message Dimm {
  string slot = 1;                    // the firmware's device locator: "DIMM_C2", "DIMMB1"
  string bank = 2;                    // the firmware's bank locator
  uint64 size_bytes = 3;
  uint32 ranks = 4;
  string type = 5;                    // "DDR4", "DDR5"
  uint32 speed_mts = 6;
  string manufacturer = 7;
  string part = 8;
  string serial = 9;
  string edac = 10;                   // the kernel's location(s), "mc0/csrow2/ch2", ranks joined by "+"; as the log prints them
  string edac_type = 11;              // EDAC's own idea: "Registered-DDR4"
  string mapping = 12;                // "exact" | "inferred" | "" when slot or edac is missing
  uint64 ce = 13;                     // corrected errors since boot
  uint64 ue = 14;                     // uncorrected errors since boot
}

// DriveStatus is the server's status for a drive, returned to the agent so
// the local listing can show it without network access.
message DriveStatus {
  DriveIdentity identity = 1;
  string status = 2;                  // ok | suspect | bad | shelved | retired
  string note = 3;
}

// AgentConfig is server-driven cadence; the agent applies it on its next
// tick.
message AgentConfig {
  google.protobuf.Duration inventory_interval = 1;
  google.protobuf.Duration smart_interval = 2;   // unset: agent default (6h)
  google.protobuf.Duration io_bucket = 3;
  bool collect_smart = 4;
  bool collect_io = 5;
}

message ReportInventoryResponse {
  bool accepted = 1;
  string reject_reason = 2;           // "clock_skew", "stale", "malformed"
  bool changed = 3;                   // the state differed from the previous snapshot
  repeated DriveStatus statuses = 4;
  AgentConfig config = 5;
}

// KernelSample is one hour of one class of kernel log line about one drive.
message KernelSample {
  DriveIdentity identity = 1;
  string dev_name = 2;
  google.protobuf.Timestamp bucket_start = 3;
  uint32 bucket_secs = 4;
  string class = 5;                   // attach detach predictive_failure medium_error hardware_error io_error timeout link_reset recovered other; hw_corrected hw_uncorrected for the host itself
  // identity is unset and dev_name "" for a line about the host itself (a
  // memory or machine-check error); the server records those as
  // hardware_error events on the host.
  string scsi_code = 6;               // "key:asc:ascq" in hex, e.g. "1:5d:90"; the location ("mc0/csrow3/ch1") for a hardware error; "" otherwise
  uint32 count = 7;
  string sample = 8;                  // the first line in the bucket
  string hostname = 9;                // set in query responses
}

// SmartSummary is the per-sample subset of SMART kept in the database.
// Unset fields are ones the drive's bus does not report, never zero.
message SmartSummary {
  string protocol = 1;                // "ATA", "SCSI", "NVMe"
  optional bool healthy = 2;
  optional uint64 power_on_hours = 3;
  optional int32 temp_c = 4;
  optional uint64 reallocated = 5;    // SATA 5 | SAS grown defect list
  optional uint64 pending = 6;        // SATA 197
  optional uint64 uncorrectable = 7;  // SATA 198 | SAS uncorrected r+w | NVMe media_errors
  optional uint64 crc_errors = 8;     // SATA 199
  optional uint64 read_bytes = 9;
  optional uint64 write_bytes = 10;
  optional uint32 percent_used = 11;  // wear
  string selftest_last = 12;
}

message SmartSample {
  DriveIdentity identity = 1;
  string dev_name = 2;
  google.protobuf.Timestamp ts = 3;
  SmartSummary summary = 4;           // unset when skipped
  bytes raw_json_gz = 5;              // gzip of smartctl -j output; optional
  string skipped = 6;                 // "" | "standby" | "timeout" | "unsupported" | "error: …"
  string hostname = 7;                // set in query responses
  bool has_raw = 8;                   // set in query responses: raw is stored for this sample
}

message ReportSmartRequest {
  HostIdentity host = 1;
  repeated SmartSample samples = 2;
}

// ReportBundle is what `drivelist report --output` writes and
// `drivelist admin ingest` submits: one host's inventory report and,
// optionally, a SMART pass, so a host that holds no token can be
// collected over ssh from one that does.
message ReportBundle {
  ReportInventoryRequest inventory = 1;
  ReportSmartRequest smart = 2;
  ReportDiskStatsRequest diskstats = 3;   // unset when the host has no /proc/diskstats
}

// DiskStat is one whole-disk line of /proc/diskstats, cumulative since
// boot, as the kernel counts it.
message DiskStat {
  string name = 1;
  uint64 reads = 2;
  uint64 writes = 3;
  uint64 sectors_read = 4;
  uint64 sectors_written = 5;
  uint64 read_ms = 6;
  uint64 write_ms = 7;
  uint64 io_ms = 8;
  uint64 weighted_ms = 9;
}

message ReportDiskStatsRequest {
  HostIdentity host = 1;
  google.protobuf.Timestamp at = 2;   // when the counters were read
  double uptime_secs = 3;             // the host's uptime then; 0 when unknown
  repeated DiskStat stats = 4;
}

// IOSample is one hour of one drive's I/O, as deltas of /proc/diskstats
// counters plus the worst 60 s sub-sample inside the hour.
message IOSample {
  DriveIdentity identity = 1;
  string dev_name = 2;
  google.protobuf.Timestamp bucket_start = 3;
  uint32 bucket_secs = 4;
  uint64 reads = 5;
  uint64 writes = 6;
  uint64 read_bytes = 7;
  uint64 write_bytes = 8;
  uint64 read_ms = 9;                 // r_await = read_ms / reads
  uint64 write_ms = 10;
  uint64 io_ms = 11;                  // util = io_ms / (bucket_secs * 1000)
  uint64 weighted_ms = 12;            // aqu-sz = weighted_ms / (bucket_secs * 1000)
  double r_await_max_ms = 13;
  double w_await_max_ms = 14;
  double util_max = 15;
  string hostname = 16;               // set in query responses
  // The completions read_ms and write_ms account for. Equal to reads and
  // writes unless the agent rejected an interval whose time counter jumped
  // by the host's uptime (a kernel accounting bug); then that interval's
  // completions count for throughput but not latency. Agents before 0.4
  // leave them 0, which the server reads as "all of them".
  uint64 await_reads = 17;
  uint64 await_writes = 18;
  uint32 glitches = 19;               // time counters rejected this hour
}

message ReportIORequest {
  HostIdentity host = 1;
  repeated IOSample samples = 2;
}

message ReportKernelRequest {
  HostIdentity host = 1;
  repeated KernelSample samples = 2;
}

message ReportAck {
  bool accepted = 1;
  string reject_reason = 2;
  uint32 stored = 3;
}

// ---------- Query ----------

message Host {
  string hostname = 1;
  string machine_id = 2;
  string os = 3;
  string agent_version = 4;
  google.protobuf.Timestamp first_seen = 5;
  google.protobuf.Timestamp last_report = 6;
  google.protobuf.Timestamp stale_since = 7;   // unset when the host is reporting
  int32 drive_count = 8;              // open placements
  int32 missing_count = 9;            // drives that vanished from this host and are not back
  int32 ghost_count = 10;             // open pool ghosts
  google.protobuf.Timestamp booted_at = 11;   // when the host last booted, if its agent says
}

message Placement {
  string hostname = 1;
  string enclosure = 2;               // stable key: the SES enclosure id, else the reaching node's SAS address, else its kernel name
  string bay = 3;
  string dev_name = 4;
  repeated string uses = 5;
  google.protobuf.Timestamp first_seen = 6;
  google.protobuf.Timestamp last_seen = 7;     // last heartbeat that confirmed it
  google.protobuf.Timestamp ended_at = 8;      // unset while current
  string end_reason = 9;              // vanished | moved | use_changed | merged
  string enclosure_via = 10;          // the kernel's current name for the node that reaches the enclosure, "expander-11:0" or "host11"
  string enclosure_name = 11;         // the name a person gave the enclosure, "" if none
  string bay_label = 12;              // the bay as the hardware profile names it, "" when no profile maps this bay
}

// Enclosure is one physical place drives sit in (a shelf, a backplane,
// a server's front panel) on one host.
message Enclosure {
  string enclosure = 1;               // the key placements carry
  string hostname = 2;
  string via = 3;                     // the node that reaches it: "expander-11:0", "host11"
  string name = 4;
  string note = 5;
  int32 drives = 6;                   // drives currently placed in it
  google.protobuf.Timestamp first_seen = 7;
  google.protobuf.Timestamp last_seen = 8;
  string product = 9;                 // vendor and product of the reaching node, from the SAS topology
  int32 bays = 10;                    // bays seen, empty ones included, or declared by the hardware profile if more
  string profile = 11;                // title of the hardware profile that matched the model, "" if none
  string board = 12;                  // the DMI board name, when the enclosure is a chassis
}

message ListBaysRequest {
  string ref = 1;                     // as NameEnclosure
}

// BayView is one bay of an enclosure: declared by the profile, or seen
// with a drive in it, or both.
message BayView {
  string label = 1;                   // the profile's name for it, else the firmware identity
  repeated string ids = 2;            // "sas:54", "pci:9-1", "ata:ata3"
  bool declared = 3;                  // the profile lists it
  bool present = 4;                   // a drive is in it
  string dev_name = 5;
  string serial = 6;
  string model = 7;
  string status = 8;
  repeated string uses = 9;
}

message ListSmartRequest {
  string host = 1;                    // "" for every host
  bool problems = 2;                  // only drives whose reading says something is wrong
}

// SmartRow is one placed drive with its newest SMART reading.
message SmartRow {
  Drive drive = 1;
  SmartSample sample = 2;             // the newest with a summary; unset when none
  string last_skipped = 3;            // why the newest sample of all was skipped, when newer than sample
  bool problem = 4;                   // health failed, an error counter nonzero, or 80% of rated life used
}

message ListSmartResponse {
  repeated SmartRow rows = 1;         // problems first, then by host and slot
}

message ListDimmsRequest {
  string host = 1;                    // "" for every host
  bool problems = 2;                  // only modules with errors: any uncorrected, or corrected in the last day
}

// DimmRow is one module on one host with what the server has counted.
message DimmRow {
  string hostname = 1;
  Dimm dimm = 2;
  google.protobuf.Timestamp first_seen = 3;
  google.protobuf.Timestamp last_seen = 4;
  uint64 ce_day = 5;                  // corrected errors counted in the last 24 h
  uint64 ue_day = 6;
  google.protobuf.Timestamp last_error = 7;   // when a count last grew; unset if never
  bool problem = 8;
}

message ListDimmsResponse {
  repeated DimmRow rows = 1;          // problems first, then by host and slot
}

message ListBaysResponse {
  Enclosure enclosure = 1;
  repeated BayView bays = 2;
  int32 rows = 3;                     // layout, 0 when the profile gives none
  int32 columns = 4;
  string order = 5;
}

message ListEnclosuresRequest {}

message ListEnclosuresResponse {
  repeated Enclosure enclosures = 1;
}

message NameEnclosureRequest {
  string ref = 1;                     // the key, an unambiguous part of it, or the reaching node's kernel name if only one host has it
  string name = 2;                    // "" clears the name
  string note = 3;
  string actor = 4;
}

message NameEnclosureResponse {
  Enclosure enclosure = 1;
}

message GetSASRequest {
  string host = 1;
}

message SasNodeState {
  SasNode node = 1;
  string hostname = 2;
  google.protobuf.Timestamp first_seen = 3;
  google.protobuf.Timestamp last_seen = 4;
  google.protobuf.Timestamp gone_at = 5;   // unset while present
}

message SasPhyState {
  SasPhy phy = 1;
  string hostname = 2;
  string owner_name = 3;              // the node's kernel name
  string serial = 4;                  // of the drive behind it, if any
  google.protobuf.Timestamp first_seen = 5;
  google.protobuf.Timestamp last_seen = 6;
  google.protobuf.Timestamp gone_at = 7;
}

message GetSASResponse {
  repeated SasNodeState nodes = 1;
  repeated SasPhyState phys = 2;
}

message ListSASErrorsRequest {
  string host = 1;                    // "" for every host
  google.protobuf.Timestamp since = 2;
}

// SasErrorRow is one phy's counter growth over the window.
message SasErrorRow {
  string hostname = 1;
  string owner_name = 2;
  string owner_address = 3;
  uint32 phy_id = 4;
  string port = 5;
  string attached_kind = 6;
  string attached = 7;
  string dev_name = 8;
  string serial = 9;
  string bay = 10;
  uint64 invalid_dword = 11;          // growth in the window
  uint64 disparity_error = 12;
  uint64 loss_dword_sync = 13;
  uint64 phy_reset_problem = 14;
  google.protobuf.Timestamp last_at = 15;
  uint32 samples = 16;                // reports in which a counter grew
}

message ListSASErrorsResponse {
  repeated SasErrorRow rows = 1;
}

message Drive {
  int64 drive_id = 1;
  string wwn = 2;
  string vendor = 3;
  string model = 4;
  string serial = 5;
  uint64 size_bytes = 6;
  Bus bus = 7;
  string status = 8;
  google.protobuf.Timestamp first_seen = 9;
  google.protobuf.Timestamp last_seen = 10;
  Placement current = 11;             // unset when the drive is not currently placed
  Placement last = 12;                // the most recent placement when current is unset
  string member_state = 13;
}

message Event {
  int64 event_id = 1;
  google.protobuf.Timestamp ts = 2;
  string kind = 3;
  string serial = 4;                  // of the drive, when the event is about one
  string wwn = 5;
  string hostname = 6;                // when the event is about, or happened on, a host
  string detail = 7;                  // JSON object; keys depend on kind
  string source = 8;                  // "snapshot:123" | "user:scott@laptop" | "sweeper"
}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message ListDrivesRequest {
  string host = 1;                    // hostname or unambiguous prefix; "" = all
  repeated string status = 2;         // filter: ok suspect bad shelved retired
  bool unused_only = 3;
  bool missing_only = 4;
  string model = 5;                   // substring match
}

message ListDrivesResponse {
  repeated Drive drives = 1;
}

message GetDriveRequest {
  string ref = 1;                     // serial, WWN, or unambiguous prefix of either
}

message GetDriveResponse {
  Drive drive = 1;
  repeated string keys = 2;           // every identity key the drive has been seen under
  Event last_status = 3;              // the status_changed event behind Drive.status, if any
}

message GetDriveHistoryRequest {
  string ref = 1;
}

message GetDriveHistoryResponse {
  Drive drive = 1;
  repeated Placement placements = 2;  // oldest first
  repeated Event events = 3;          // oldest first
}

message ListEventsRequest {
  google.protobuf.Timestamp since = 1;
  repeated string kinds = 2;
  string host = 3;
  int32 limit = 4;                    // 0 = server default
}

message ListEventsResponse {
  repeated Event events = 1;
}

message ListMissingRequest {}

// Ghost is a pool member a host still expects that matches no present
// device.
message Ghost {
  string hostname = 1;
  string pool = 2;
  string path = 3;
  string guid = 4;
  string state = 5;
  string serial = 6;                  // when the path resolved to a known drive
  string wwn = 7;
  google.protobuf.Timestamp first_seen = 8;
  google.protobuf.Timestamp last_seen = 9;
}

message ListMissingResponse {
  repeated Drive drives = 1;          // each with last set
  repeated Ghost ghosts = 2;
}

message AnnotateRequest {
  string ref = 1;
  string status = 2;                  // "" = note only
  string note = 3;
  string actor = 4;
}

message AnnotateResponse {
  Event event = 1;
}

message GetKernelRequest {
  string ref = 1;
  google.protobuf.Timestamp since = 2;
}

message GetKernelResponse {
  Drive drive = 1;
  repeated KernelSample samples = 2;
}

message GetSmartRequest {
  string ref = 1;
  google.protobuf.Timestamp since = 2;
  bool include_raw = 3;               // attach the newest raw smartctl JSON
}

message GetSmartResponse {
  Drive drive = 1;
  repeated SmartSample samples = 2;
  bytes raw_json = 3;                 // uncompressed, newest stored, when include_raw
  google.protobuf.Timestamp raw_ts = 4;
}

message GetIORequest {
  string ref = 1;
  google.protobuf.Timestamp since = 2;
}

message GetIOResponse {
  Drive drive = 1;
  repeated IOSample samples = 2;
}

message CompareIORequest {
  string host = 1;                    // "" = every host
  google.protobuf.Timestamp since = 2;
}

// IOComparison is one drive's averages over the window beside its group's
// median. The group is the vdev the drive belongs to, from its use string
// with the leaf removed; drives in no pool share the group "".
message IOComparison {
  string group = 1;
  string hostname = 2;
  string serial = 3;
  string model = 4;
  string dev_name = 5;
  uint64 reads = 6;
  uint64 writes = 7;
  double r_await_ms = 8;
  double w_await_ms = 9;
  double util = 10;
  double group_r_await_ms = 11;
  double group_w_await_ms = 12;
  double group_util = 13;
  int32 group_size = 14;
  uint32 glitches = 15;               // time counters rejected in the window
}

message CompareIOResponse {
  repeated IOComparison rows = 1;
}

message MergeDrivesRequest {
  string into = 1;
  string from = 2;
  string actor = 3;
}

message MergeDrivesResponse {
  Event event = 1;
}

message MergeHostsRequest {
  string into = 1;
  string from = 2;
  string actor = 3;
}

message MergeHostsResponse {
  Event event = 1;
}

message RebuildRequest {}

message RebuildResponse {
  int32 snapshots = 1;
  int32 placements = 2;
  int32 events = 3;
}
